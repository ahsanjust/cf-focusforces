<!DOCTYPE html>
<html>
<head>
    <title>Test Canvas</title>
    <style>
        body { background: #222; margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c" width="800" height="600"></canvas>
    <script>
        const gfx = document.getElementById('c').getContext('2d');
        const PI2 = Math.PI * 2;
        
        const PALETTES = [
            { core: '#e8f6ff', mid: '#8ec8f8', glow: [72, 136, 220] },
            { core: '#f0e6ff', mid: '#c090f8', glow: [120, 64, 220] },
            { core: '#fffbe4', mid: '#f8d870', glow: [210, 148, 48] }
        ];

        const CAT_DOTS = [
            // tail (curves left-and-up from body rear)
            [-0.58, -0.19, 0.46, 0.56, 0.00],
            [-0.55, -0.31, 0.50, 0.60, 0.55],
            [-0.49, -0.42, 0.54, 0.64, 1.10],
            [-0.41, -0.51, 0.57, 0.67, 1.65],
            [-0.30, -0.53, 0.52, 0.62, 2.20],
            [-0.18, -0.47, 0.54, 0.64, 2.75],
            // back legs
            [-0.23, -0.07, 0.79, 0.89, 0.30],
            [-0.23, -0.19, 0.74, 0.83, 0.95],
            [-0.11, -0.07, 0.81, 0.91, 0.55],
            [-0.11, -0.19, 0.76, 0.85, 1.45],
            // body
            [-0.22, -0.28, 0.91, 1.10, 1.85],
            [-0.10, -0.34, 1.00, 1.26, 2.35],
            [ 0.01, -0.36, 1.00, 1.28, 2.90],
            [ 0.12, -0.32, 0.95, 1.16, 3.45],
            [ 0.17, -0.24, 0.88, 1.06, 4.00],
            [-0.28, -0.23, 0.83, 1.00, 1.30],
            [-0.05, -0.23, 0.86, 1.04, 2.10],
            [-0.15, -0.19, 0.80, 0.96, 1.60],
            // front legs
            [ 0.17, -0.07, 0.79, 0.89, 0.20],
            [ 0.17, -0.19, 0.74, 0.83, 0.90],
            [ 0.27, -0.07, 0.81, 0.91, 0.50],
            [ 0.27, -0.19, 0.76, 0.85, 1.65],
            // neck
            [ 0.20, -0.43, 0.82, 0.96, 2.55],
            // head
            [ 0.29, -0.50, 0.90, 1.06, 3.00],
            [ 0.37, -0.55, 1.00, 1.16, 3.55],
            [ 0.33, -0.62, 0.87, 1.02, 4.10],
            [ 0.43, -0.57, 0.85, 1.00, 4.65],
            [ 0.39, -0.49, 0.83, 0.98, 5.20],
            // ears
            [ 0.30, -0.69, 0.68, 0.72, 5.55],
            [ 0.34, -0.76, 0.60, 0.64, 6.10],
            [ 0.44, -0.71, 0.70, 0.74, 5.80],
            [ 0.48, -0.65, 0.63, 0.68, 6.35],
            // eyes
            [ 0.33, -0.57, 1.00, 0.44, 0.00],
            [ 0.42, -0.57, 1.00, 0.44, Math.PI],
            // whiskers
            [ 0.51, -0.54, 0.32, 0.30, 2.15],
            [ 0.55, -0.56, 0.26, 0.26, 2.75],
            [ 0.51, -0.59, 0.30, 0.28, 3.35],
            // nose
            [ 0.46, -0.53, 0.78, 0.38, 1.20],
        ];

        function rga(glow, a) {
            return `rgba(${glow[0]},${glow[1]},${glow[2]},${a.toFixed(3)})`;
        }

        function drawCat(x, y, size, palIdx, gTime) {
            const pal = PALETTES[palIdx];
            const baseR = Math.max(1.0, size * 0.035);
            const breathe = 1.0;

            gfx.save();
            gfx.translate(x, y);

            // faint aura
            const auraY = -size * 0.30;
            const auraGrad = gfx.createRadialGradient(0, auraY, 0, 0, auraY, size * 0.5);
            auraGrad.addColorStop(0.00, rga(pal.glow, breathe * 0.15));
            auraGrad.addColorStop(1.00, rga(pal.glow, 0));
            gfx.beginPath();
            gfx.ellipse(0, auraY, size * 0.5, size * 0.35, 0, 0, PI2);
            gfx.fillStyle = auraGrad;
            gfx.fill();

            // lines connecting dots
            gfx.beginPath();
            for (const [dx, dy] of CAT_DOTS) {
                gfx.lineTo(dx * size, dy * size);
            }
            gfx.strokeStyle = rga(pal.glow, 0.1);
            gfx.lineWidth = size * 0.02;
            gfx.stroke();

            // Glow dots
            for (const [dx, dy, brightness, rf, phase] of CAT_DOTS) {
                const twinkle = 0.7 + 0.3 * Math.sin(gTime * 2 + phase);
                const a = Math.min(1, breathe * twinkle * brightness);
                if (a < 0.04) continue;

                const dotR = baseR * rf;
                const px = dx * size;
                const py = dy * size;

                // outer glow
                gfx.globalAlpha = a * 0.6;
                gfx.fillStyle = pal.mid;
                gfx.beginPath();
                gfx.arc(px, py, dotR * 2.0, 0, PI2);
                gfx.fill();

                // core
                gfx.globalAlpha = a;
                gfx.fillStyle = pal.core;
                gfx.beginPath();
                gfx.arc(px, py, dotR * 0.7, 0, PI2);
                gfx.fill();
            }

            gfx.restore();
        }

        let start = Date.now();
        function loop() {
            gfx.clearRect(0,0,800,600);
            let t = (Date.now() - start)/1000;
            drawCat(200, 300, 100, 0, t);
            drawCat(400, 300, 60, 1, t);
            drawCat(600, 300, 30, 2, t);
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
